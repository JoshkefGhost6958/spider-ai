services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: spider-ai:latest
    container_name: spider_ai_web
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DJANGO_DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
    volumes:
      - spider_sqlite_data:/app/data
      - spider_media_data:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  spider_sqlite_data:
  spider_media_data:
